name: Update earnings calendar

on:
  schedule:
    - cron: "15 22 * * *"    # 每天 台北 06:15（美股收盤、盤後財報公布後）
    - cron: "30 11 * * 1-5"  # 平日 台北 19:30（美股開盤前再補一次）
  workflow_dispatch:          # 可在 GitHub 手動按「Run workflow」
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: earnings-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image tool (shrinks big logos)
        run: pip install pillow

      - name: Fetch earnings + logos
        run: python3 scripts/update.py
        continue-on-error: true   # 資料源暫時抓不到時，仍用上次的資料重新產生網站
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

      - name: Build site
        run: python3 scripts/build.py

      - name: Save data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/logos
          git diff --cached --quiet || git commit -m "chore: update earnings data"
          git pull --rebase -X theirs origin main   # 期間若有其他更新（例如你改了設定），先合併再推
          git push

      # 只同步 dist/earnings/ → 網站的 public_html/earnings/（SFTP），不會碰到 WordPress 其他檔案
      - name: Upload to Cloudways (/earnings)
        env:
          CW_HOST: ${{ secrets.CW_HOST }}
          CW_USER: ${{ secrets.CW_USER }}
          LFTP_PASSWORD: ${{ secrets.CW_PASS }}
        run: |
          if [ -z "$CW_HOST" ] || [ -z "$CW_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::尚未設定 Cloudways 連線資料（CW_HOST / CW_USER / CW_PASS），請到 Settings → Secrets and variables → Actions 新增"
            exit 1
          fi
          test -f dist/earnings/index.html   # 網頁沒產生成功就不上傳
          for v in CW_HOST CW_USER LFTP_PASSWORD; do
            val="${!v}"
            if [[ "$val" =~ ^[[:space:]] || "$val" =~ [[:space:]]$ ]]; then echo "::warning::$v 前後有多餘的空白或換行，請重新貼上"; fi
          done
          sudo apt-get install -y -qq lftp > /dev/null
          # logo 很少變動：固定檔案時間，之後只會上傳有變的檔案
          find dist/earnings/logos -type f -exec touch -t 202001010000 {} +
          LFTP="lftp --env-password -u $CW_USER sftp://$CW_HOST"
          SETTINGS="set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5"
          set +e
          home=$($LFTP -e "$SETTINGS; cls -1; bye" 2>&1)
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::無法用 SFTP 登入 Cloudways：$(echo "$home" | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          if ! echo "$home" | grep -q '^public_html/\?$'; then
            echo "::error::登入後找不到 public_html 資料夾，登入位置的內容是：$(echo "$home" | head -20 | tr '\n' ' ')"
            exit 1
          fi
          out=$($LFTP -e "$SETTINGS; mirror -R --delete --parallel=6 --verbose=1 dist/earnings public_html/earnings; bye" 2>&1)
          code=$?
          set -e
          echo "$out" | tail -40
          if [ $code -ne 0 ]; then
            echo "::error::上傳失敗（代碼 $code）：$(echo "$out" | grep -iv '^Transferring' | tail -5 | tr '\n' ' ')"
            exit $code
          fi
          echo "已上傳到 public_html/earnings/"
